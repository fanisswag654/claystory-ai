name: Connect Telegram bot to ClayStory review webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate hosted webhook and official Telegram bot token
        run: |
          python -m pip install 'requests>=2.32,<3'
          python - <<'PY'
          import requests
          health=requests.get(
            "https://claystory-whatsapp-approval.onrender.com/",
            timeout=45
          )
          health.raise_for_status()
          data=health.json()
          if data.get("service")!="claystory-review-approval":
              raise RuntimeError("The Render review webhook app is not yet deployed")
          print("Render review webhook is responding.")
          print("Configured for live Telegram reviews:",bool(data.get("telegram_configured",False)))
          print("Note: initial setup may correctly show false until trusted reviewer IDs are configured.")
          PY
      - name: Register the bot webhook safely (no Instagram posting)
        run: python automation/telegram_setup.py
