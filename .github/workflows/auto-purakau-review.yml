name: Pūrākau Pixels — cinematic story and Telegram approval
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Story with prepared cinematic artwork
        required: false
        type: string
        default: maui-mahuika-fire
  schedule:
    - cron: '0 19 * * 1'
permissions:
  contents: write
  actions: read
jobs:
  generate_for_telegram:
    if: github.event_name == 'workflow_dispatch' || vars.PURAKAU_TELEGRAM_ENABLED == 'true'
    uses: ./.github/workflows/cinematic-purakau.yml
    with:
      topic: ${{ inputs.topic || 'maui-mahuika-fire' }}
    secrets: inherit
