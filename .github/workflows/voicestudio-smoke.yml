name: VoiceStudio — free CPU male narrator test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/voicestudio_voice.py'
      - 'automation/requirements-voicestudio.txt'
      - '.github/workflows/voicestudio-smoke.yml'
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOICESTUDIO_SOURCE: .voicestudio
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMNIVOICE_ANALYTICS_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: debpalash/VoiceStudio
          ref: 429f1e5bb2703ac5b928ab8ba6f60159167e9c44
          path: .voicestudio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU narrator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install 'torch==2.7.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r automation/requirements-voicestudio.txt
      - name: Generate and measure real Bruno narration
        run: |
          python automation/voicestudio_voice.py
          python - <<'PY'
          import json,subprocess
          p='automation/output/voicestudio-narrator-preview.mp3'
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',p]))
          assert 3<float(probe['format']['duration'])<20
          assert probe['streams'][0]['codec_name']=='mp3'
          print('Real CPU VoiceStudio narrator passed:',probe['format']['duration'],'seconds')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: voicestudio-bruno-narrator
          path: |
            automation/output/voicestudio-narrator-preview.mp3
            automation/output/voicestudio-narrator-preview.json
          retention-days: 14
