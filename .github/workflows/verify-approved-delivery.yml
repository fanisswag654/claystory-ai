name: Verify existing approved Instagram delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-approved-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Read existing Buffer post only
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"scripts")
          from instagram_reels import buffer_api
          post=buffer_api('query { post(input: { id: "6ae38e34b3aaeefe23224b5b" }) { id channelId status shareMode dueAt sentAt externalLink } }')["post"]
          if not post or post["channelId"]!="6ae277352f1f5ed648046667":
              raise RuntimeError("Existing post account mismatch")
          print("EXISTING_APPROVED_POST",json.dumps(post))
          PY
