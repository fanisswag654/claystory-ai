name: Verify existing approved Instagram delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-approved-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Read existing Buffer post only
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"scripts")
          from instagram_reels import buffer_api
          post=buffer_api('query { post(input: { id: "6ae38e34b3aaeefe23224b5b" }) { id channelId status shareMode dueAt } }')["post"]
          if not post or post["channelId"]!="6ae277352f1f5ed648046667":
              raise RuntimeError("Existing post account mismatch")
          print("EXISTING_APPROVED_POST",json.dumps(post))
          schema=buffer_api('query { __schema { queryType { fields { name args { name type { kind name ofType { kind name } } } type { kind name ofType { kind name } } } } } }')
          fields=schema["__schema"]["queryType"]["fields"]
          print(json.dumps([f for f in fields if "post" in f["name"].lower()],indent=2))
          types=buffer_api('query { __schema { types { kind name fields { name type { kind name ofType { kind name } } } inputFields { name type { kind name ofType { kind name } } } } } }')
          for t in types["__schema"]["types"]:
              if t["name"] in ("Post","PostInput","GetPostInput") or ("Post" in t["name"] and t["kind"]=="INPUT_OBJECT" and not any(s in t["name"] for s in ("Create","Edit","Update","Delete"))):
                  print(json.dumps(t))
          PY
