name: Generate ClayStory neural narration
on:
  workflow_dispatch:
    inputs:
      custom_script:
        description: "Optional custom story script (paste up to 6 paragraphs; blank = built-in stories)"
        required: false
        type: string
  push:
    paths:
      - 'scripts/generate_narration.py'
      - '.github/workflows/narration.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: claystory-narration-push
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'edge-tts>=7,<8'
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate MP3 voice for each scene
        env:
          CUSTOM_SCRIPT: ${{ inputs.custom_script }}
        run: python scripts/generate_narration.py
      - name: Commit narration audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Save the generated files before refreshing the branch.
          mkdir -p /tmp/claystory-audio
          cp -a audio/. /tmp/claystory-audio/
          if [ -f custom-story.json ]; then cp custom-story.json /tmp/claystory-custom-story.json; fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p audio
            cp -a /tmp/claystory-audio/. audio/
            if [ -f /tmp/claystory-custom-story.json ]; then cp /tmp/claystory-custom-story.json custom-story.json; fi
            git add audio/ custom-story.json 2>/dev/null || git add audio/
            if git diff --cached --quiet; then
              echo "Narration files already match the remote branch."
              exit 0
            fi
            git commit -m "Generate scene narration audio"
            if git push origin HEAD:main; then
              echo "Narration published successfully."
              exit 0
            fi
            echo "Push conflict on attempt $attempt; refreshing main and retrying..."
            sleep 3
          done
          echo "Could not publish narration after 5 attempts."
          exit 1
