name: Generate ClayStory neural narration
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_narration.py'
      - '.github/workflows/narration.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'edge-tts>=7,<8'
      - name: Generate MP3 voice for each scene
        run: python scripts/generate_narration.py
      - name: Commit narration audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate scene narration audio"
            git push
          fi
