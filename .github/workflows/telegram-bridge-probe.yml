name: Telegram approval bridge — verify signed /check (NO Instagram)

on:
  repository_dispatch:
    types: [purakau_telegram_probe]

permissions:
  contents: read

jobs:
  verify_review_bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PURAKAU_APPROVAL_SIGNING_KEY: ${{ secrets.PURAKAU_APPROVAL_SIGNING_KEY }}
      TELEGRAM_APPROVER_USER_ID: ${{ secrets.TELEGRAM_APPROVER_USER_ID }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PURAKAU_TELEGRAM_PROBE_RECEIPT: ${{ toJSON(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm secure Render-to-GitHub Telegram bridge
        run: |
          python -m pip install 'requests>=2.32,<3'
          python automation/telegram_bridge_probe.py
      - name: Confirm no publishing was possible
        if: success()
        run: |
          echo "## Telegram-to-GitHub signed approval bridge verified"
          echo "This independent diagnostic has no Buffer API key or Instagram permissions."
          echo "Scheduled automation and production publishing remain disabled."
