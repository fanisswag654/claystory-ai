name: Telegram — preview real V33 film + test buttons (NO Instagram)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send_real_video_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
      TELEGRAM_APPROVER_USER_ID: ${{ secrets.TELEGRAM_APPROVER_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm Telegram webhook is awake
        run: |
          python -m pip install 'requests>=2.32,<3'
          python - <<'PY'
          import requests
          response=requests.get("https://claystory-whatsapp-approval.onrender.com/",timeout=70)
          response.raise_for_status()
          info=response.json()
          if info.get("service")!="claystory-review-approval":
              raise RuntimeError("Review webhook is not active yet")
          if not info.get("telegram_configured",False):
              raise RuntimeError("Telegram private reviewer IDs or final approval signing keys are missing on Render; preview test can still run once Render is ready")
          print("Telegram approval web service is awake.")
          PY
      - name: Verify and send existing approved Tāne film with TEST ONLY buttons
        run: python automation/telegram_video_smoke.py
      - name: Confirm zero Instagram/Buffer side effects
        if: success()
        run: |
          echo "## Test video delivered via Telegram"
          echo "Previously approved V33 video sent with TEST ONLY buttons."
          echo "Click either test button to receive an acknowledgment."
          echo "No Instagram, Buffer, AI generation or GitHub dispatch permissions exist in this workflow."
