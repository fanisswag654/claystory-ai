name: Pūrākau Pixels automation — offline security and animation tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/auto-purakau-review.yml'
      - '.github/workflows/auto-purakau-decision.yml'
      - '.github/workflows/auto-purakau-tests.yml'

permissions:
  contents: read

jobs:
  safe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline unit test and browser libraries
        run: |
          python -m pip install 'flask>=3,<4' 'requests>=2.32,<3' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Compile approval, video and story source code
        run: |
          python -m compileall -q automation
          python -m unittest discover -s automation -p 'test_*.py' -v
      - name: Test distinct story scenes in actual browser with no API keys
        run: python automation/test_scene_browser.py
      - name: Confirm automation remains disabled by default
        run: |
          python - <<'PY'
          from pathlib import Path
          generate=Path(".github/workflows/auto-purakau-review.yml").read_text()
          decision=Path(".github/workflows/auto-purakau-decision.yml").read_text()
          assert "vars.PURAKAU_TELEGRAM_ENABLED == 'true'" in generate
          # General scheduled generation stays OFF, while publishing this
          # one already-reviewed, SHA-pinned video is enabled ONLY after its
          # separate signed owner Telegram approval.
          assert "vars.PURAKAU_TELEGRAM_ENABLED == 'true'" not in decision
          assert "auto-review-maui-mahuika-fire-ddb8318a9296" in decision
          assert "ddb8318a9296de8418643294e82dec8d7f52056278185bd470ceb3ec72ed107c" in decision
          assert "github.event.client_payload.platform == 'telegram'" in decision
          assert "purakau_telegram_decision" in decision
          cinematic=Path(".github/workflows/cinematic-purakau.yml").read_text()
          assert "./.github/workflows/cinematic-purakau.yml" in generate
          assert "automation/telegram_send.py" in cinematic
          assert "OPENAI_API_KEY" not in cinematic
          assert "automation/render_cinematic.py" in cinematic
          print("Validated: automated story generation stays OFF; cinematic videos require signed Telegram approval; scheduled generation stays gated")
          PY
