name: Pūrākau Pixels — cinematic stills and Christopher to Telegram
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Story with eight prepared cinematic images
        type: string
        default: ''
      motion:
        description: Camera motion engine
        type: choice
        options: [depthflow, gentle-pan]
        default: depthflow
  workflow_call:
    inputs:
      topic:
        type: string
        default: ''
      motion:
        type: string
        default: depthflow
  push:
    branches: [main]
    paths: ['automation/cinematic-system.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: purakau-story-candidates
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PURAKAU_MOTION: ${{ inputs.motion || 'depthflow' }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REQUESTED_TOPIC: ${{ inputs.topic || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
      TELEGRAM_APPROVER_USER_ID: ${{ secrets.TELEGRAM_APPROVER_USER_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      INSTAGRAM_CHANNEL_ID: '6ae277352f1f5ed648046667'
      INSTAGRAM_USERNAME: purakaupixel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free voice and film tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'requests>=2.32,<3' 'edge-tts>=7,<8' 'flask>=3,<4' 'playwright>=1.50,<2'
          python -m compileall -q automation
          python -m unittest discover -s automation -p 'test_*.py' -q
      - name: Install DepthFlow for the selected parallax renderer
        if: env.PURAKAU_MOTION == 'depthflow'
        run: |
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libgl1 libxkbcommon0
          python -m pip install 'torch==2.7.1+cpu' 'torchvision==0.22.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r automation/requirements-depthflow.txt
      - name: Check artwork, private reviewer and destination before rendering
        run: |
          python - <<'PY'
          import os,sys,json
          sys.path[:0]=["automation","scripts"]
          from cinematic_assets import verify_assets
          from telegram_free_preview import verified_private_credentials
          from instagram_reels import instagram_channel
          topic=os.getenv("REQUESTED_TOPIC") or json.load(open("automation/cinematic-system.json")).get("next_review_topic","maui-mahuika-fire")
          verify_assets(topic)
          with open(os.environ["GITHUB_ENV"],"a") as env:
              env.write("REQUESTED_TOPIC="+topic+"\n")
          verified_private_credentials(os.environ)
          assert instagram_channel()["id"]=="6ae277352f1f5ed648046667"
          PY
      - name: Retire approval buttons on drafts replaced by this edit
        run: |
          python - <<'PY'
          import json,os,sys,requests
          sys.path.insert(0,"automation")
          from telegram_free_preview import verified_private_credentials
          token,chat=verified_private_credentials(os.environ)
          config=json.load(open("automation/cinematic-system.json"))
          for message_id in config.get("superseded_telegram_message_ids",[]):
              if not isinstance(message_id,int) or message_id<1:raise ValueError("Invalid replaced draft ID")
              response=requests.post(
                  "https://api.telegram.org/bot"+token+"/editMessageCaption",
                  json={"chat_id":chat,"message_id":message_id,
                        "caption":"SUPERSEDED DRAFT — a revised film with a new hook, gentle camera pans and updated mataora artwork replaces this video. Please use the latest review video.",
                        "reply_markup":{"inline_keyboard":[]}},timeout=30)
              print("Replaced Telegram draft",message_id,"button removal HTTP",response.status_code)
          PY
      - name: Curated script, Christopher speech and selected cinematic motion
        run: |
          python automation/prepare_story.py --mode curated --topic "$REQUESTED_TOPIC" --output automation/candidate-story.json
          python automation/make_audio.py
          python automation/render_cinematic.py
          python automation/finalize_proposal.py
      - name: Pin exact MP4 as a review release and send real Telegram buttons
        run: |
          set -euo pipefail
          TAG="$(python -c 'import json;print(json.load(open("automation/output/proposal.json"))["proposal_id"])')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Exact video already proposed; refusing duplicate delivery."
            exit 0
          fi
          gh release create "$TAG" automation/output/purakau-review.mp4 automation/output/proposal.json automation/output/story.json --repo "$GITHUB_REPOSITORY" --latest=false --title "Cinematic Pūrākau — awaiting Telegram approval" --notes "Christopher at natural pitch; portrait cinematic motion. Only the authorized Telegram approval can publish this exact SHA-verified film."
          python automation/telegram_send.py automation/output/proposal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-purakau-review
          path: |
            automation/output/purakau-review.mp4
            automation/output/proposal.json
            automation/output/manifest.json
            automation/output/story.json
            automation/output/timing.json
          retention-days: 14
